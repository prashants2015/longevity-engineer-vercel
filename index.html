<style>

  /* ── hero shell ─────────────────────────── */

  .login{

    text-decoration:none;

  .login:hover{opacity:1;text-decoration:underline;text-underline-offset:3px}

  .cta-header,.cta-inline,.float-pill{

    text-decoration:none;

  .cta-header{background:var(--mint)}
  .cta-inline{background:var(--mint);align-self:flex-start}
  .float-pill{background:var(--yellow)}
  .cta-header:hover,.cta-inline:hover,.float-pill:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(18,24,27,.16)}
  .cta-header:active,.cta-inline:active,.float-pill:active{transform:translateY(0);box-shadow:none}

  .badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:26px;height:26px;
    border-radius:50%;
    background:var(--icon-green);
    flex:none;
  }
  .badge svg{width:14px;height:14px;fill:#fff}

  /* ── illustrated stage ──────────────────── */
  .stage{
    position:relative;
    flex:1 1 auto;
    min-height:460px;
    overflow:hidden;
  }

  .clouds{position:absolute;inset:0;z-index:1;pointer-events:none}
  .cloud{position:absolute;width:130px;height:48px;background:#fff;border-radius:60px;opacity:.92}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .cloud::before{width:64px;height:64px;top:-30px;left:16px}
  .cloud::after{width:48px;height:48px;top:-22px;right:12px}
  .c1{top:9%;left:4%;transform:scale(1.15)}
  .c2{top:23%;left:63%;transform:scale(.85);opacity:.85}
  .c3{top:6%;left:80%;transform:scale(.6);opacity:.8}
  .c4{top:42%;left:15%;transform:scale(.5);opacity:.6}
  .c5{top:34%;left:70%;transform:scale(1.1);opacity:.5}

  .content{
    position:absolute;
    left:clamp(1.25rem, 6vw, 3rem);
    right:1.25rem;
    bottom:calc(var(--hillH) + clamp(30px, 7vw, 72px));
    max-width:var(--measure);
    z-index:3;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:1.125rem;

  .hill{position:absolute;left:0;right:0;bottom:0;width:100%;height:var(--hillH);z-index:2;display:block}

  .foot-links{
    position:absolute;
    left:clamp(1.25rem, 6vw, 3rem);
    right:clamp(1.25rem, 6vw, 3rem);
    bottom:clamp(14px, 3vw, 26px);
    z-index:3;
    display:flex;
    flex-wrap:wrap;
    justify-content:flex-end;

  .foot-links a{font-size:.8125rem;font-weight:500;text-decoration:none;color:var(--ink);opacity:.75}
  .foot-links a:hover{opacity:1;text-decoration:underline;text-underline-offset:3px}

  /* ── floating desktop CTA ───────────────── */
  .float-pill{
    display:none;
    position:fixed;
    right:clamp(1rem, 4vw, 2.5rem);
    top:54%;
    transform:translateY(-50%);
    z-index:20;
    padding:.75rem 1.25rem .75rem .625rem;
    font-size:1rem;
    box-shadow:0 10px 30px rgba(18,24,27,.18);
  }

  @media (min-width:861px){
    .float-pill{display:inline-flex}
    .cta-inline{display:none}
  }

  @media (prefers-reduced-motion:reduce){
